<!-- 🔒 GUARD DA LOUSA - Bloqueia acesso direto sem ativação do professor -->
<script>
(function(){
  const params = new URLSearchParams(window.location.search);
  const role = params.get('role') || 'aluno';
  const room = params.get('room') || 'global';
  const lockedParam = params.get('locked');
  
  // Se for aluno, verifica se professor ativou antes de liberar desenho
  if(role === 'aluno'){
    // Tenta verificar status via API
    async function verificarAcesso(){
      try {
        const res = await fetch(`/api/workspace/sala/workspace-lousa/status/${encodeURIComponent(room)}`, { credentials: 'include' });
        const data = await res.json();
        console.log('[LOUSA GUARD] status:', data);
        if(!data || !data.success || !data.ativa){
          // Professor não ativou - bloqueia e mostra mensagem
          document.body.innerHTML = `
            <div style="height:100vh; display:flex; align-items:center; justify-content:center; background:#0f172a; color:white; flex-direction:column; gap:20px; font-family:sans-serif; text-align:center; padding:20px;">
              <div style="font-size:60px;">💤</div>
              <h2 style="font-size:22px; margin:0;">Aguardando o professor ativar a lousa</h2>
              <p style="color:#94a3b8; font-size:14px;">A lousa da turma ${room} ainda não foi liberada.<br>Esta página será liberada automaticamente quando o professor clicar em "Ativar Visualização".</p>
              <div style="background:#1e293b; padding:10px 20px; border-radius:20px; font-size:12px;">🔄 Verificando a cada 3s...</div>
            </div>
          `;
          // Tenta novamente em 3s
          setTimeout(verificarAcesso, 3000);
          return false;
        }
        // Se chegou aqui, professor ativou - libera, mas respeita locked
        if(data.recursos === false && lockedParam === 'false'){
          // Professor só liberou visualização, mas aluno tentou acessar com locked=false via URL direta
          // Força locked=true
          const url = new URL(window.location.href);
          url.searchParams.set('locked', 'true');
          window.location.href = url.toString();
          return false;
        }
        return true;
      } catch(e){
        console.warn('[LOUSA GUARD] erro ao verificar', e);
        return true; // em caso de erro de rede, deixa passar para não travar
      }
    }
    verificarAcesso();
  }
})();
</script>
