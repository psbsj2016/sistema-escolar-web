<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lousa Colaborativa</title>
  <style>*{box-sizing:border-box}html,body,#root{height:100%;margin:0;font-family:Inter,system-ui}#waiting-overlay{position:fixed;inset:0;z-index:999999;background:#0f172a;color:#fff;display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px;text-align:center;padding:20px}</style>
</head>
<body>
  <div id="waiting-overlay"><div style="font-size:60px;">💤</div><h2>Aguardando professor ativar</h2><p id="waiting-room" style="color:#94a3b8"></p></div>
  <div id="root"></div>
  <script type="module">
    import React, { useEffect, useState, useCallback } from 'react';
    import ReactDOM from 'react-dom/client';
    import { Tldraw, createTLStore, defaultShapeUtils, defaultBindingUtils } from '@tldraw/tldraw';
    import '@tldraw/tldraw/tldraw.css';
    import * as Y from 'yjs';
    import { WebrtcProvider } from 'y-webrtc';

    const params = new URLSearchParams(window.location.search);
    const role = params.get('role') || 'professor';
    const turmaId = params.get('room') || 'global';
    const locked = params.get('locked') === 'true';
    const yjsRoom = `ptt-lousa-${turmaId}`;

    const overlay = document.getElementById('waiting-overlay');
    async function checkAccess(){
      if(role!=='aluno'){ if(overlay) overlay.style.display='none'; return true; }
      try{
        const res = await fetch(`/api/workspace/sala/workspace-lousa/status/${encodeURIComponent(turmaId)}`, {credentials:'include'});
        const data = await res.json();
        if(!data?.success || !data.ativa){
          if(overlay) overlay.style.display='flex';
          setTimeout(checkAccess,3000); return false;
        }
        if(overlay) overlay.style.display='none'; return true;
      }catch{ if(overlay) overlay.style.display='none'; return true; }
    }
    checkAccess();

    function useYjsStore(roomId){
      const [store] = useState(()=> createTLStore({ shapeUtils: defaultShapeUtils, bindingUtils: defaultBindingUtils }));
      const [provider, setProvider] = useState(null);
      const [connected, setConnected] = useState(false);
      useEffect(()=>{
        const doc = new Y.Doc();
        const yMap = doc.getMap('tldraw');
        const prov = new WebrtcProvider(roomId, doc, { signaling: ['wss://signaling.yjs.dev','wss://y-webrtc-signaling-eu.herokuapp.com'] });
        prov.on('synced', ()=> setConnected(true));
        const handleY = (e)=>{ if(e.transaction.local) return; try{ store.mergeRemoteChanges(()=>{ yMap.forEach(v=>{ if(v) try{ store.put([v]); }catch{} }); }); }catch{} };
        yMap.observe(handleY);
        const unsub = store.listen((entry)=>{
          if(entry.source!=='user') return;
          doc.transact(()=>{
            for(const [id,rec] of Object.entries(entry.changes.added)) yMap.set(id, rec);
            for(const [id,rec] of Object.entries(entry.changes.updated)){ const [,to]=rec; yMap.set(id,to); }
            for(const [id] of Object.entries(entry.changes.removed)) yMap.delete(id);
          }, 'local');
        }, {scope:'document', source:'user'});
        setProvider(prov);
        return ()=>{ yMap.unobserve(handleY); unsub(); prov.destroy(); doc.destroy(); };
      }, [roomId]);
      return { store, provider, connected };
    }

    function App(){
      const { store, provider, connected } = useYjsStore(yjsRoom);
      const [editor, setEditor] = useState(null);
      const [peers, setPeers] = useState(1);
      useEffect(()=>{
        if(!provider) return;
        const upd = ()=>{ try{ setPeers(provider.awareness.getStates().size); }catch{} };
        const iv = setInterval(upd,2000);
        provider.awareness.on('change', upd);
        return ()=>{ clearInterval(iv); provider.awareness.off('change', upd); };
      }, [provider]);
      const onMount = useCallback((ed)=>{ setEditor(ed); ed.updateInstanceState({ isReadonly: role==='aluno' && locked }); }, []);
      useEffect(()=>{ editor?.updateInstanceState({ isReadonly: role==='aluno' && locked }); }, [editor]);
      return React.createElement('div', {style:{height:'100vh', display:'flex', flexDirection:'column'}},
        React.createElement('div', {style:{height:48, background:'#0F172A', color:'#fff', display:'flex', alignItems:'center', justifyContent:'space-between', padding:'0 12px'}},
          React.createElement('div', {style:{display:'flex', gap:10, alignItems:'center'}},
            React.createElement('div', {style:{width:28,height:28,borderRadius:8,background:'#14B8A6',display:'grid',placeItems:'center'}}, '🖍️'),
            React.createElement('div', {style:{fontWeight:700, fontSize:13}}, `Lousa ${turmaId} ${locked ? '🔒' : ''}`),
            React.createElement('div', {style:{fontSize:11, background:'rgba(255,255,255,0.1)', padding:'3px 8px', borderRadius:12}}, `${connected ? 'Ao vivo' : 'Conectando...'} • ${peers}`)
          )
        ),
        React.createElement('div', {style:{flex:1}}, React.createElement(Tldraw, { store, onMount }))
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
