<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Lousa Interativa Tldraw</title>
  <style>
    *,*::before,*::after{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;padding:0;font-family:Inter,system-ui,sans-serif;overflow:hidden;background:#f8fafc;overscroll-behavior:none;}
    /* FIX: altura real dentro da plataforma (iframe) */
    #root{width:100%;height:100vh;height:100dvh;min-height:480px;display:flex;flex-direction:column;position:relative;background:#f8fafc;isolation:isolate;}
    .tldraw-wrapper{position:relative;flex:1;width:100%;height:100%;min-height:480px;overflow:hidden;display:flex;}
    .tldraw-wrapper > div{position:absolute !important;inset:0 !important;width:100% !important;height:100% !important;}
    /* FIX: impede CSS da plataforma esconder a toolbar */
    .tlui-toolbar, .tlui-style-panel{visibility:visible !important;opacity:1 !important;pointer-events:auto !important;}
    .tela-preta { position:absolute; inset:0; background:#0f172a; color:#fff; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:20px; text-align:center; padding:20px; z-index:50; width:100%; height:100%; }
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="module">
    import React, { useEffect, useState, useCallback, useRef } from 'react';
    import ReactDOM from 'react-dom/client';
    import { Tldraw } from '@tldraw/tldraw';
    import '@tldraw/tldraw/tldraw.css';

    function getInitialParams() {
      let role = 'professor', roomId = 'global';
      try {
        const p = new URLSearchParams(window.location.search);
        if (p.get('role')) role = p.get('role');
        if (p.get('room') || p.get('turma')) roomId = p.get('room') || p.get('turma');
        // fallback: tenta parent se a plataforma tira a query
        if (window.parent && window.parent !== window) {
          try {
            const pp = new URLSearchParams(window.parent.location.search);
            if (!p.get('role') && pp.get('role')) role = pp.get('role');
            if (!p.get('room') && (pp.get('room') || pp.get('turma'))) roomId = pp.get('room') || pp.get('turma');
          } catch(e){}
        }
      } catch(e){}
      return { role, roomId };
    }
    const init = getInitialParams();

    function App() {
        const [editor, setEditor] = useState(null);
        const [isAllowed, setIsAllowedState] = useState(init.role !== 'aluno');
        const [dynamicLocked, setDynamicLockedState] = useState(true);

        // REFS - correção do bug de closure que travava a lousa
        const roleRef = useRef(init.role);
        const roomIdRef = useRef(init.roomId);
        const isAllowedRef = useRef(init.role !== 'aluno');
        const dynamicLockedRef = useRef(true);
        const isRemoteUpdateRef = useRef(false);
        const saveTimeoutRef = useRef(null);

        const setIsAllowed = useCallback((v) => { isAllowedRef.current = !!v; setIsAllowedState(!!v); }, []);
        const setDynamicLocked = useCallback((v) => { dynamicLockedRef.current = !!v; setDynamicLockedState(!!v); }, []);

        // Recebe INIT da plataforma se ela enviar via postMessage
        useEffect(() => {
            const onInit = (e) => {
                const d = e.data || {};
                if (d.type === 'INIT_LOUSA' || d.type === 'LOUSA_INIT') {
                  if (d.role) roleRef.current = d.role;
                  if (d.room || d.roomId || d.turmaId) roomIdRef.current = d.room || d.roomId || d.turmaId;
                  if (d.role && d.role !== 'aluno') setIsAllowed(true);
                }
                if (d.type === 'LOCK_STATE') setDynamicLocked(!!d.locked);
                if (d.type === 'RELOAD_DADOS' && window._loadCloud) window._loadCloud();
            };
            window.addEventListener('message', onInit);
            try { window.parent?.postMessage({ type: 'LOUSA_READY' }, '*'); } catch(e){}
            return () => window.removeEventListener('message', onInit);
        }, [setIsAllowed, setDynamicLocked]);

        // 1. Polling de Segurança para o Aluno (MANTIDO)
        useEffect(() => {
            if (roleRef.current !== 'aluno') return;
            const check = async () => {
                try {
                    const res = await fetch(`/api/workspace/sala/workspace-lousa/status/${encodeURIComponent(roomIdRef.current)}`, { cache: 'no-store' });
                    const data = await res.json();
                    if (data?.success && data.ativa) {
                        setIsAllowed(true);
                        setDynamicLocked(!data.recursos);
                    } else {
                        setIsAllowed(false);
                    }
                } catch(e) {}
            };
            check();
            const inv = setInterval(check, 2500);
            return () => clearInterval(inv);
        }, [setIsAllowed, setDynamicLocked]);

        // 2. Ouve Comandos em Tempo Real (MANTIDO)
        useEffect(() => {
            const onMsg = (e) => {
                if (e.data?.type === 'LOCK_STATE') setDynamicLocked(!!e.data.locked);
                if (e.data?.type === 'RELOAD_DADOS' && window._loadCloud) window._loadCloud();
            };
            window.addEventListener('message', onMsg);
            return () => window.removeEventListener('message', onMsg);
        }, [setDynamicLocked]);

        // 3. Aplica o Cadeado às Ferramentas (MANTIDO, agora com ref)
        useEffect(() => {
            if (editor) {
              try { editor.updateInstanceState({ isReadonly: roleRef.current === 'aluno' && dynamicLockedRef.current }); } catch(e){}
            }
        }, [editor, dynamicLocked]);

        // 4. Arranque da Tldraw - FIX PRINCIPAL: callback estável
        const onMount = useCallback((ed) => {
            setEditor(ed);
            try { ed.updateInstanceState({ isReadonly: roleRef.current === 'aluno' && dynamicLockedRef.current }); } catch(e){}

            const loadCloud = async () => {
                if(roleRef.current === 'aluno' && !isAllowedRef.current) return; 
                try {
                    const res = await fetch(`/api/workspace/sala/workspace-lousa/dados/${encodeURIComponent(roomIdRef.current)}`, { cache: 'no-store' });
                    const data = await res.json();
                    if (data?.success && data.records?.length > 0) {
                        isRemoteUpdateRef.current = true;
                        ed.store.mergeRemoteChanges(() => { try { ed.store.put(data.records); } catch(e){} });
                        setTimeout(() => { try { ed.zoomToFit(); } catch(e){} }, 100);
                        isRemoteUpdateRef.current = false;
                    }
                } catch(e) {}
            };

            window._loadCloud = loadCloud;
            loadCloud();

            // FIX: recalcula tamanho quando a plataforma redimensiona o iframe
            const ro = new ResizeObserver(() => {
              try { window.dispatchEvent(new Event('resize')); ed.updateViewportScreenBounds(); } catch(e){}
            });
            try { ro.observe(document.getElementById('root')); } catch(e){}

            const unsub = ed.store.listen((entry) => {
                if (entry.source !== 'user') return;
                if (isRemoteUpdateRef.current) return;
                if (roleRef.current === 'aluno' && dynamicLockedRef.current) return;

                clearTimeout(saveTimeoutRef.current);
                saveTimeoutRef.current = setTimeout(() => {
                    const records = ed.store.allRecords();
                    fetch(`/api/workspace/sala/workspace-lousa/dados/${encodeURIComponent(roomIdRef.current)}`, {
                        method: 'PUT', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ records })
                    }).catch(()=>{});
                }, 350); 
            }, { scope: 'document', source: 'user' });
            
            return () => { try{ro.disconnect()}catch(e){} try{unsub()}catch(e){} clearTimeout(saveTimeoutRef.current); };
        }, []); // << VAZIO DE PROPÓSITO - não remonta mais e não some as ferramentas

        // 5. Escutador SSE (MANTIDO)
        useEffect(() => {
            let escolaId = 'DEFAULT';
            try { escolaId = JSON.parse(localStorage.getItem('ws_usuario_logado')).escolaId; } catch(e){
              try { const p = new URLSearchParams(window.location.search); if(p.get('escolaId')) escolaId = p.get('escolaId'); } catch(e2){}
            }
            let es;
            try {
              es = new EventSource(`/api/workspace/stream?escolaId=${encodeURIComponent(escolaId)}`);
              es.onmessage = (event) => {
                  try {
                      const data = JSON.parse(event.data);
                      if (data.type === 'LOUSA_DADOS_CHANGED' && (data.turmaId === roomIdRef.current || data.turmaId === 'global')) {
                          if (window._loadCloud) window._loadCloud();
                      }
                  } catch(e){}
              };
            } catch(e){}
            return () => { try{es?.close()}catch(e){} };
        }, []);

        if (!isAllowed) {
            return React.createElement('div', { className: 'tela-preta' },
                React.createElement('div', {style:{fontSize:'60px', filter:'grayscale(100%) opacity(0.5)', animation:'pulse 2s infinite'}}, '⏳'),
                React.createElement('h2', {style:{fontSize:'22px', margin:'0 0 10px 0'}}, 'Aguardando Liberação...'),
                React.createElement('p', {style:{color:'#94a3b8', fontSize:'14px', maxWidth:'350px'}}, 'O professor está a preparar a lousa. Ela será exibida aqui assim que for ativada no painel de controlo.'),
                React.createElement('div', {style:{background:'rgba(255,255,255,0.1)', padding:'8px 16px', borderRadius:'20px', fontSize:'12px', fontWeight:'bold'}}, '🔄 Conectado de forma segura')
            );
        }

        return React.createElement('div', {className: 'tldraw-wrapper'},
            React.createElement(Tldraw, { onMount: onMount, inferDarkMode: false, autoFocus: true })
        );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
