<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Lousa Interativa v14</title>
  <style>
    *,*::before,*::after{box-sizing:border-box}
    html,body,#root{width:100%;height:100%;margin:0;padding:0;font-family:Inter,system-ui,sans-serif;overflow:hidden;background:#fff}
    #waiting-overlay{position:fixed;inset:0;z-index:999999;background:#0f172a;color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;text-align:center;padding:20px}
    #waiting-overlay.hidden{display:none !important}
  </style>
</head>
<body>
  <!-- TELA DE BLOQUEIO ABSOLUTO -->
  <div id="waiting-overlay">
    <div style="font-size:60px; filter: grayscale(100%) opacity(0.5); animation: pulse 2s infinite;">⏳</div>
    <h2 style="font-size:22px;margin:0;">Lousa inativa no momento</h2>
    <p style="color:#94a3b8;font-size:14px; max-width: 350px;">A lousa encontra-se fechada. Ela será exibida aqui assim que for ativada no painel de controlo.</p>
    <div style="background:#1e293b;padding:8px 16px;border-radius:20px;font-size:12px; font-weight: bold;">🔄 Sincronizando com o servidor...</div>
  </div>
  
  <div id="root" style="width:100%; height:100%;"></div>

  <script type="module">
    import React, { useEffect, useState, useCallback, useRef } from 'react';
    import ReactDOM from 'react-dom/client';
    import { Tldraw } from '@tldraw/tldraw';
    import '@tldraw/tldraw/tldraw.css';

    class ErrorBoundary extends React.Component {
      constructor(p){ super(p); this.state={hasError:false, error:null}; }
      static getDerivedStateFromError(e){ return {hasError:true, error:e}; }
      componentDidCatch(e,info){ console.error("🚨 Lousa crash:", e, info); }
      render(){ 
        if(this.state.hasError){
          return React.createElement('div',{style:{padding:30,color:'#c0392b',background:'#fdf2f2',height:'100vh',display:'flex',flexDirection:'column',justifyContent:'center',alignItems:'center',textAlign:'center'}},
            React.createElement('div',{style:{fontSize:50, marginBottom: 15}},'🚨'),
            React.createElement('h2',{style:{margin:'0 0 10px 0'}},'Lousa com erro'),
            React.createElement('pre',{style:{fontSize:12,background:'#fff',padding:10,borderRadius:8, maxWidth:'90%', overflow:'auto'}}, this.state.error?.toString()),
            React.createElement('button',{onClick:()=>location.reload(), style:{marginTop:15, padding:'8px 16px', borderRadius:8, border:0, background:'#0F172A', color:'#fff', cursor:'pointer'}},'Recarregar')
          );
        }
        return this.props.children;
      }
    }

    const params = new URLSearchParams(window.location.search);
    const role = params.get('role') || 'professor';
    const roomId = params.get('room') || 'global';
    const initialLocked = params.get('locked') === 'true';

    const overlay = document.getElementById('waiting-overlay');

    // 🚀 BLOQUEIO ABSOLUTO PARA TODOS (Professor e Aluno)
    async function checkAccess(){
      try{
        const res = await fetch(`/api/workspace/sala/workspace-lousa/status/${encodeURIComponent(roomId)}`, {credentials:'include'});
        const data = await res.json();
        if(data?.success && data.ativa){ 
          if(overlay) overlay.classList.add('hidden'); 
          return { allowed:true, recursos: !!data.recursos };
        } else {
          if(overlay) overlay.classList.remove('hidden');
          return { allowed:false, recursos:false };
        }
      }catch(e){ 
        return { allowed:false, recursos:false }; // Segurança máxima em caso de falha
      }
    }

    function App(){
      const [editor, setEditor] = useState(null);
      const [dynamicLocked, setDynamicLocked] = useState(initialLocked);
      const isRemoteUpdateRef = useRef(false);
      const saveTimeoutRef = useRef(null);

      // Ouve comandos do painel (Trancar/Destrancar Caneta)
      useEffect(()=>{
        const onMsg = (e)=>{
          if(e.data?.type === 'LOCK_STATE') setDynamicLocked(!!e.data.locked);
          if(e.data?.type === 'RELOAD_DADOS' && window._loadCloud) window._loadCloud();
        };
        window.addEventListener('message', onMsg);
        return ()=> window.removeEventListener('message', onMsg);
      },[]);

      // Polling de segurança (A cada 2 segundos verifica se a lousa foi desligada)
      useEffect(() => {
        const poll = setInterval(async () => {
            const acc = await checkAccess();
            if (acc.allowed && typeof acc.recursos !== 'undefined' && role === 'aluno') {
                setDynamicLocked(!acc.recursos);
            }
        }, 2000);
        return () => clearInterval(poll);
      }, []);

      // Atualiza o bloqueio no ecrã
      useEffect(()=>{
        if(editor) editor.updateInstanceState({ isReadonly: role==='aluno' && dynamicLocked });
      },[editor, dynamicLocked]);

      const onMount = useCallback((ed)=>{
        setEditor(ed);
        ed.updateInstanceState({ isReadonly: role==='aluno' && dynamicLocked });

        const loadCloud = async () => {
          try{
            const access = await checkAccess();
            if(!access.allowed) return; 

            const res = await fetch(`/api/workspace/sala/workspace-lousa/dados/${encodeURIComponent(roomId)}`, {credentials:'include'});
            const data = await res.json();
            if(data?.success && data.records && data.records.length>0){
              const shapesOnly = data.records.filter(r => r.typeName==='shape' || r.typeName==='binding' || r.typeName==='asset');
              if(shapesOnly.length>0){
                isRemoteUpdateRef.current = true;
                ed.store.mergeRemoteChanges(()=>{
                  try{ ed.store.put(shapesOnly); }catch(e){}
                });
                isRemoteUpdateRef.current = false;
              }
            }
          }catch(e){ }
        };

        window._loadCloud = loadCloud;
        loadCloud();

        // 🚀 SALVAMENTO PERFEITO COM DEBOUNCE (Resolve o atraso nos traços)
        ed.store.listen((entry)=>{
          if(entry.source!=='user') return;
          if(isRemoteUpdateRef.current) return;
          if(role==='aluno' && dynamicLocked) return;

          clearTimeout(saveTimeoutRef.current);
          saveTimeoutRef.current = setTimeout(() => {
              const all = ed.store.allRecords();
              const shapes = all.filter(r => r.typeName==='shape' || r.typeName==='binding' || r.typeName==='asset');
              
              fetch(`/api/workspace/sala/workspace-lousa/dados/${encodeURIComponent(roomId)}`, {
                method:'PUT', credentials:'include', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({ records: shapes })
              }).catch(()=>{});
          }, 400); // Aguarda 400ms após o aluno/professor parar de mover o rato
        }, {scope:'document', source:'user'});

      }, [dynamicLocked]);

      // 🚀 TÚNEL SSE DIRETO NO IFRAME (Garante a sincronização em tempo real para ambos)
      useEffect(() => {
          let escolaId = 'DEFAULT';
          try { escolaId = JSON.parse(localStorage.getItem('ws_usuario_logado')).escolaId; } catch(e){}
          
          const es = new EventSource(`/api/workspace/stream?escolaId=${encodeURIComponent(escolaId)}`);
          es.onmessage = (event) => {
              try {
                  const data = JSON.parse(event.data);
                  if (data.type === 'LOUSA_DADOS_CHANGED' && (data.turmaId === roomId || data.turmaId === 'global')) {
                      if (window._loadCloud) window._loadCloud();
                  }
              } catch(e){}
          };
          return () => es.close();
      }, []);

      return React.createElement(ErrorBoundary, null,
        // Barra interior duplicada foi removida. O Tldraw ocupa agora os 100% da tela.
        React.createElement('div',{style:{flex:1, position:'relative', width:'100%', height:'100%'}},
          React.createElement(Tldraw,{onMount:onMount})
        )
      );
    }

    // Arranca a aplicação só depois de verificar
    checkAccess().then(() => {
        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
    });
  </script>
</body>
</html>
