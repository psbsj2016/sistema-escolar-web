<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Lousa Interativa</title>
  <style>
    *{box-sizing:border-box} 
    html,body,#root{height:100%;margin:0;font-family:Inter,system-ui,sans-serif;overflow:hidden;background:#fff;}
    #waiting-overlay{position:fixed;inset:0;z-index:999999;background:#0f172a;color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;text-align:center;padding:20px}
    #waiting-overlay.hidden{display:none !important}
    .tl-container{flex:1; min-height:0; position:relative}
  </style>
</head>
<body>
  <div id="waiting-overlay">
    <div style="font-size:60px;">💤</div>
    <h2 style="font-size:18px;margin:0;">Aguardando professor ativar a lousa</h2>
    <p id="waiting-room" style="color:#94a3b8;font-size:13px;">Turma <span id="waiting-turma"></span> - aguardando liberação</p>
    <div style="background:#1e293b;padding:8px 16px;border-radius:20px;font-size:11px;">🔄 Verificando...</div>
  </div>
  <div id="root"></div>

  <script type="module">
    import React, { useEffect, useState, useCallback, useRef } from 'react';
    import ReactDOM from 'react-dom/client';
    import { Tldraw } from '@tldraw/tldraw';
    import '@tldraw/tldraw/tldraw.css';

    // 🛡️ ESCUDO DE ERROS DO REACT (Mostra o erro em vez de ecrã branco)
    class ErrorBoundary extends React.Component {
        constructor(props) { super(props); this.state = { hasError: false, error: null }; }
        static getDerivedStateFromError(error) { return { hasError: true, error }; }
        componentDidCatch(error, errorInfo) { console.error("🚨 Crash na Lousa:", error, errorInfo); }
        render() {
            if (this.state.hasError) {
                return React.createElement('div', {style:{padding:'30px', color:'#c0392b', background:'#fdf2f2', height:'100vh', fontFamily:'sans-serif', display:'flex', flexDirection:'column', justifyContent:'center', alignItems:'center', textAlign:'center'}}, 
                    React.createElement('div', {style:{fontSize:'50px', marginBottom:'15px'}}, '🚨'),
                    React.createElement('h2', {style:{margin:'0 0 10px 0'}}, 'A Lousa encontrou um obstáculo'),
                    React.createElement('p', null, this.state.error.toString())
                );
            }
            return this.props.children;
        }
    }

    const params = new URLSearchParams(window.location.search);
    const role = params.get('role') || 'professor';
    const roomId = params.get('room') || 'global';
    const initialLocked = params.get('locked') === 'true';

    const overlay = document.getElementById('waiting-overlay');
    const waitingTurma = document.getElementById('waiting-turma');
    if(waitingTurma) waitingTurma.textContent = roomId === 'global' ? 'Geral' : roomId;

    // Guard - Proteção de Acesso
    let isAllowed = role !== 'aluno'; 
    async function checkAccess(){
      if(role !== 'aluno'){
        if(overlay) overlay.classList.add('hidden');
        return true;
      }
      try{
        const res = await fetch(`/api/workspace/sala/workspace-lousa/status/${encodeURIComponent(roomId)}`, {credentials:'include'});
        const data = await res.json();
        if(!data?.success || !data.ativa){
          isAllowed = false;
          if(overlay) overlay.classList.remove('hidden');
          return false;
        }
        isAllowed = true;
        if(overlay) overlay.classList.add('hidden');
        return true;
      }catch(e){
        return true; // Se a rede falhar, assume permitido para não expulsar
      }
    }
    checkAccess();
    setInterval(checkAccess, 3000);

    function App(){
      const [editor, setEditor] = useState(null);
      const [connected, setConnected] = useState(false);
      const [dynamicLocked, setDynamicLocked] = useState(initialLocked);
      const isRemoteUpdateRef = useRef(false);
      const lastSavedRef = useRef(0);

      // 1. Ouve os comandos silenciosos (Cadeado do aluno)
      useEffect(() => {
          const handleMessage = (event) => {
              if (event.data && event.data.type === 'LOCK_STATE') {
                  setDynamicLocked(event.data.locked);
              }
          };
          window.addEventListener('message', handleMessage);
          return () => window.removeEventListener('message', handleMessage);
      }, []);

      // 2. Quando o tldraw arranca (Inicialização Nativa)
      const onMount = useCallback((ed) => {
          setEditor(ed);
          
          // Liberta ou tranca o lápis
          ed.updateInstanceState({ isReadonly: role === 'aluno' && dynamicLocked });
          
          // Função para buscar desenhos na nuvem
          const carregarNuvem = async () => {
              try {
                  const res = await fetch(`/api/workspace/sala/workspace-lousa/dados/${encodeURIComponent(roomId)}`, {credentials:'include'});
                  const data = await res.json();
                  if(data?.success && data.records && data.records.length > 0){
                      const shapesOnly = data.records.filter(r => r.typeName === 'shape' || r.typeName === 'binding' || r.typeName === 'asset');
                      isRemoteUpdateRef.current = true;
                      ed.store.mergeRemoteChanges(() => {
                          try { ed.store.put(shapesOnly); } catch(e){}
                      });
                      isRemoteUpdateRef.current = false;
                  }
              } catch(e) {} finally {
                  setConnected(true); // O estado muda para "Ao vivo" garantidamente
              }
          };

          if(role !== 'aluno' || isAllowed) {
              carregarNuvem();
          }

          // Salva os traços novos na nuvem (Debounce de 1 segundo)
          ed.store.listen((entry) => {
              if (role === 'aluno' && dynamicLocked) return; // Não salva se estiver trancado
              if (entry.source !== 'user') return;
              if (isRemoteUpdateRef.current) return;

              const now = Date.now();
              if (now - lastSavedRef.current < 1000) return; 
              lastSavedRef.current = now;

              const shapes = ed.store.allRecords().filter(r => r.typeName === 'shape' || r.typeName === 'binding' || r.typeName === 'asset');
              
              fetch(`/api/workspace/sala/workspace-lousa/dados/${encodeURIComponent(roomId)}`, {
                  method: 'PUT', credentials: 'include', headers: {'Content-Type': 'application/json'},
                  body: JSON.stringify({ records: shapes })
              }).catch(()=>{});

          }, { scope: 'document', source: 'user' });

          // Expõe a função para o SSE usar depois
          window._carregarNuvemLocal = carregarNuvem;

      }, [dynamicLocked]);

      // 3. Ouve o Tempo Real (SSE - Aluno)
      useEffect(() => {
          if(role !== 'aluno') return;
          
          let escolaId = 'DEFAULT';
          try { escolaId = JSON.parse(localStorage.getItem('ws_usuario_logado')).escolaId; } catch(e){}

          const es = new EventSource(`/api/workspace/stream?escolaId=${encodeURIComponent(escolaId)}`);
          
          es.onmessage = (event) => {
              try {
                  const data = JSON.parse(event.data);
                  if (data.type === 'LOUSA_DADOS_CHANGED' && (data.turmaId === roomId || data.turmaId === 'global')) {
                      if (window._carregarNuvemLocal) window._carregarNuvemLocal();
                  }
              } catch(e){}
          };
          
          // Radar de segurança a cada 4 segundos
          const interval = setInterval(() => {
              if (window._carregarNuvemLocal) window._carregarNuvemLocal();
          }, 4000);
          
          return () => { es.close(); clearInterval(interval); };
      }, [roomId]);

      // 4. Aplica bloqueio dinâmico
      useEffect(()=>{
        if(!editor) return;
        editor.updateInstanceState({ isReadonly: role === 'aluno' && dynamicLocked });
      }, [editor, dynamicLocked]);

      const isLocked = role === 'aluno' && dynamicLocked;

      return React.createElement(ErrorBoundary, null,
          React.createElement('div', {style:{height:'100vh', width:'100vw', display:'flex', flexDirection:'column', background:'#fff'}},
            React.createElement('div', {style:{height:48, background:'#0F172A', color:'#fff', display:'flex', alignItems:'center', justifyContent:'space-between', padding:'0 12px', flexShrink:0}},
              React.createElement('div', {style:{display:'flex', alignItems:'center', gap:10}},
                React.createElement('div', {style:{width:28,height:28,borderRadius:8,background:'#14B8A6',display:'grid',placeItems:'center'}}, '🖍️'),
                React.createElement('div', {style:{fontWeight:600, fontSize:13}}, `Lousa Interativa ${isLocked?'🔒 Somente Visualização':''}`),
                React.createElement('div', {style:{fontSize:10, background: connected ? 'rgba(34,197,94,0.2)' : 'rgba(251,191,36,0.2)', color: connected ? '#86efac' : '#fde68a', padding:'3px 8px', borderRadius:12}}, `${connected ? 'Ao vivo' : 'Conectando...'}`)
              )
            ),
            React.createElement('div', {style:{flex:1, minHeight:0, position:'relative', background:'#fff'}},
              React.createElement(Tldraw, { onMount: onMount }) // 🚀 MÁGICA AQUI: Removido o 'store' das props!
            )
          )
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
