<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Lousa Interativa Tldraw</title>
  <style>
    *,*::before,*::after{box-sizing:border-box}
    html,body,#root{width:100%;height:100%;margin:0;padding:0;font-family:Inter,system-ui,sans-serif;overflow:hidden;background:#f8fafc;}
    /* 🚀 A Tela Preta Estilizada (Prisão do Aluno) */
    .tela-preta { position:fixed; inset:0; background:#0f172a; color:#fff; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:20px; text-align:center; padding:20px; z-index: 999999; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="module">
    import React, { useEffect, useState, useCallback, useRef } from 'react';
    import ReactDOM from 'react-dom/client';
    import { Tldraw } from '@tldraw/tldraw';
    import '@tldraw/tldraw/tldraw.css';

    const params = new URLSearchParams(window.location.search);
    const role = params.get('role') || 'professor';
    const roomId = params.get('room') || 'global';

    function App() {
        const [editor, setEditor] = useState(null);
        // O Aluno nasce Bloqueado (false), o Professor nasce Livre (true)
        const [isAllowed, setIsAllowed] = useState(role !== 'aluno');
        const [dynamicLocked, setDynamicLocked] = useState(true);
        const isRemoteUpdateRef = useRef(false);
        const saveTimeoutRef = useRef(null);

        // 1. Polling de Segurança para o Aluno
        useEffect(() => {
            if (role !== 'aluno') return;
            const check = async () => {
                try {
                    const res = await fetch(`/api/workspace/sala/workspace-lousa/status/${encodeURIComponent(roomId)}`);
                    const data = await res.json();
                    if (data?.success && data.ativa) {
                        setIsAllowed(true);
                        setDynamicLocked(!data.recursos);
                    } else {
                        setIsAllowed(false);
                    }
                } catch(e) {}
            };
            check();
            const inv = setInterval(check, 2500);
            return () => clearInterval(inv);
        }, [roomId]);

        // 2. Ouve Comandos em Tempo Real (Painel do Professor)
        useEffect(() => {
            const onMsg = (e) => {
                if (e.data?.type === 'LOCK_STATE') setDynamicLocked(!!e.data.locked);
                if (e.data?.type === 'RELOAD_DADOS' && window._loadCloud) window._loadCloud();
            };
            window.addEventListener('message', onMsg);
            return () => window.removeEventListener('message', onMsg);
        }, []);

        // 3. Aplica o Cadeado às Ferramentas
        useEffect(() => {
            if (editor) editor.updateInstanceState({ isReadonly: role === 'aluno' && dynamicLocked });
        }, [editor, dynamicLocked]);

        // 4. Arranque da Tldraw e Sincronização Perfeita
        const onMount = useCallback((ed) => {
            setEditor(ed);
            ed.updateInstanceState({ isReadonly: role === 'aluno' && dynamicLocked });

            const loadCloud = async () => {
                if(role === 'aluno' && !isAllowed) return; 
                try {
                    const res = await fetch(`/api/workspace/sala/workspace-lousa/dados/${encodeURIComponent(roomId)}`);
                    const data = await res.json();
                    if (data?.success && data.records?.length > 0) {
                        isRemoteUpdateRef.current = true;
                        ed.store.mergeRemoteChanges(() => { try { ed.store.put(data.records); } catch(e){} });
                        isRemoteUpdateRef.current = false;
                    }
                } catch(e) {}
            };

            window._loadCloud = loadCloud;
            loadCloud();

            // Gravação Otimizada para o Servidor
            ed.store.listen((entry) => {
                if (entry.source !== 'user') return;
                if (isRemoteUpdateRef.current) return;
                if (role === 'aluno' && dynamicLocked) return;

                clearTimeout(saveTimeoutRef.current);
                saveTimeoutRef.current = setTimeout(() => {
                    const records = ed.store.allRecords();
                    fetch(`/api/workspace/sala/workspace-lousa/dados/${encodeURIComponent(roomId)}`, {
                        method: 'PUT', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ records })
                    }).catch(()=>{});
                }, 350); 
            }, { scope: 'document', source: 'user' });
            
        }, [dynamicLocked, isAllowed, roomId]);

        // 5. Escutador SSE (Para o aluno ver o risco em tempo real)
        useEffect(() => {
            let escolaId = 'DEFAULT';
            try { escolaId = JSON.parse(localStorage.getItem('ws_usuario_logado')).escolaId; } catch(e){}
            const es = new EventSource(`/api/workspace/stream?escolaId=${encodeURIComponent(escolaId)}`);
            es.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'LOUSA_DADOS_CHANGED' && (data.turmaId === roomId || data.turmaId === 'global')) {
                        if (window._loadCloud) window._loadCloud();
                    }
                } catch(e){}
            };
            return () => es.close();
        }, [roomId]);

        // ===============================================
        // 🎨 INTERFACES VISUAIS (TELA PRETA VS TLDRAW)
        // ===============================================
        if (!isAllowed) {
            return React.createElement('div', { className: 'tela-preta' },
                React.createElement('div', {style:{fontSize:'60px', filter:'grayscale(100%) opacity(0.5)', animation:'pulse 2s infinite'}}, '⏳'),
                React.createElement('h2', {style:{fontSize:'22px', margin:'0 0 10px 0'}}, 'Aguardando Liberação...'),
                React.createElement('p', {style:{color:'#94a3b8', fontSize:'14px', maxWidth:'350px'}}, 'O professor está a preparar a lousa. Ela será exibida aqui assim que for ativada no painel de controlo.'),
                React.createElement('div', {style:{background:'rgba(255,255,255,0.1)', padding:'8px 16px', borderRadius:'20px', fontSize:'12px', fontWeight:'bold'}}, '🔄 Conectado de forma segura')
            );
        }

        // TLDRAW COMPLETO E LIMPO (Ocupa 100% do iframe, as ferramentas ficam na base)
        return React.createElement('div', {style:{position: 'absolute', inset: 0}},
            React.createElement(Tldraw, { onMount: onMount, inferDarkMode: false })
        );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
