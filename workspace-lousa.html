<script type="module">
    import React, { useEffect, useState, useCallback } from 'react';
    import ReactDOM from 'react-dom/client';
    import { Tldraw } from '@tldraw/tldraw';
    import '@tldraw/tldraw/tldraw.css';

    const params = new URLSearchParams(window.location.search);
    const role = params.get('role') || 'professor';
    const roomId = params.get('room') || 'global';
    const initialLocked = params.get('locked') === 'true';

    const overlay = document.getElementById('waiting-overlay');
    const waitingTurma = document.getElementById('waiting-turma');
    if (waitingTurma) waitingTurma.textContent = roomId === 'global' ? 'Geral' : roomId;

    // 🚀 Escudo Invisível: Gere a tela preta de espera apenas para os alunos
    if (role === 'aluno') {
      const checkAccess = async () => {
        try {
          const res = await fetch(`/api/workspace/sala/workspace-lousa/status/${encodeURIComponent(roomId)}`);
          const data = await res.json();
          if (data?.success && data.ativa) {
            if (overlay) overlay.style.display = 'none';
          } else {
            if (overlay) overlay.style.display = 'flex';
          }
        } catch(e) {}
      };
      checkAccess();
      setInterval(checkAccess, 3000);
    } else {
      if (overlay) overlay.style.display = 'none'; // Professor tem entrada livre
    }

    // 🚀 Cérebro React (A Lousa em Si)
    function App() {
      const [editor, setEditor] = useState(null);
      const [connected, setConnected] = useState(false);
      const [dynamicLocked, setDynamicLocked] = useState(initialLocked);

      // 1. Ouve as ordens do Professor (Trancar/Destrancar Caneta sem piscar a tela)
      useEffect(() => {
          const handleMsg = (e) => { 
              if (e.data?.type === 'LOCK_STATE') setDynamicLocked(e.data.locked); 
          };
          window.addEventListener('message', handleMsg);
          return () => window.removeEventListener('message', handleMsg);
      }, []);

      // 2. Aplica o Cadeado Dinâmico ao Lápis
      useEffect(() => {
          if (editor) {
              editor.updateInstanceState({ isReadonly: role === 'aluno' && dynamicLocked });
          }
      }, [editor, dynamicLocked]);

      // 3. O Despertar da Lousa (Quando a tela carrega com sucesso)
      const onMount = useCallback((ed) => {
          setEditor(ed);

          // Função que busca os traços guardados no banco de dados
          const carregarDaNuvem = async () => {
              try {
                  const res = await fetch(`/api/workspace/sala/workspace-lousa/dados/${encodeURIComponent(roomId)}`);
                  const data = await res.json();
                  if (data?.records && data.records.length > 0) {
                      ed.store.mergeRemoteChanges(() => {
                          try { ed.store.put(data.records); } catch(e){}
                      });
                  }
                  setConnected(true);
              } catch(e) {}
          };

          carregarDaNuvem();
          window._carregarNuvemLocal = carregarDaNuvem; // Expõe para a Atualização Ao Vivo

          // 4. Gravação Otimizada: Só envia os traços a cada 400ms para não afogar a internet
          let timeout;
          ed.store.listen((entry) => {
              if (entry.source !== 'user') return; // Ignora o que o servidor mandou
              if (role === 'aluno' && dynamicLocked) return; // Aluno bloqueado não envia dados

              clearTimeout(timeout);
              timeout = setTimeout(() => {
                  const records = ed.store.allRecords();
                  fetch(`/api/workspace/sala/workspace-lousa/dados/${encodeURIComponent(roomId)}`, {
                      method: 'PUT', headers: {'Content-Type': 'application/json'},
                      body: JSON.stringify({ records })
                  }).catch(()=>{});
              }, 400); 
          }, { scope: 'document', source: 'user' });

      }, [dynamicLocked]);

      // 5. O Túnel de Tempo Real (SSE) -> Ambos ouvem as atualizações
      useEffect(() => {
          let escolaId = 'DEFAULT';
          try { escolaId = JSON.parse(localStorage.getItem('ws_usuario_logado')).escolaId; } catch(e){}
          
          const es = new EventSource(`/api/workspace/stream?escolaId=${encodeURIComponent(escolaId)}`);
          es.onmessage = (event) => {
              try {
                  const data = JSON.parse(event.data);
                  // Puxa o traço novo assim que a nuvem avisa que alguém desenhou
                  if (data.type === 'LOUSA_DADOS_CHANGED' && (data.turmaId === roomId || data.turmaId === 'global')) {
                      if (window._carregarNuvemLocal) window._carregarNuvemLocal();
                  }
              } catch(e){}
          };
          
          // Rede de segurança silenciosa a cada 5 segundos
          const inv = setInterval(() => { if (window._carregarNuvemLocal) window._carregarNuvemLocal(); }, 5000);
          return () => { es.close(); clearInterval(inv); };
      }, []);

      const isLocked = role === 'aluno' && dynamicLocked;

      // 🎨 A Interface limpa
      return React.createElement('div', {style:{height:'100vh', width:'100vw', display:'flex', flexDirection:'column'}},
        React.createElement('div', {style:{height:45, background:'#0F172A', color:'#fff', display:'flex', alignItems:'center', justifyContent:'space-between', padding:'0 15px', flexShrink:0}},
          React.createElement('div', {style:{display:'flex', alignItems:'center', gap:10}},
            React.createElement('span', {style:{fontSize:'18px'}}, '🖍️'),
            React.createElement('span', {style:{fontWeight:600, fontSize:'14px'}}, isLocked ? 'Lousa (Modo Leitura)' : 'Lousa Interativa'),
            React.createElement('span', {style:{fontSize:'10px', background: connected ? 'rgba(34,197,94,0.2)' : 'rgba(251,191,36,0.2)', color: connected ? '#86efac' : '#fde68a', padding:'3px 8px', borderRadius:12}}, connected ? 'Ao vivo' : 'Conectando...')
          )
        ),
        React.createElement('div', {style:{flex:1, position:'relative', background:'#fff'}},
          React.createElement(Tldraw, { onMount: onMount }) // 🚀 Inicialização puramente Nativa
        )
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
