<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Lousa Interativa</title>
  <style>
    *{box-sizing:border-box} 
    html,body,#root{height:100%;margin:0;font-family:Inter,system-ui,sans-serif;overflow:hidden}
    #waiting-overlay{position:fixed;inset:0;z-index:999999;background:#0f172a;color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;text-align:center;padding:20px}
    #waiting-overlay.hidden{display:none !important}
    .tl-container{flex:1; min-height:0; position:relative}
  </style>
</head>
<body>
  <div id="waiting-overlay">
    <div style="font-size:60px;">💤</div>
    <h2 style="font-size:18px;margin:0;">Aguardando professor ativar a lousa</h2>
    <p id="waiting-room" style="color:#94a3b8;font-size:13px;">Turma <span id="waiting-turma"></span> - aguardando liberação</p>
    <div style="background:#1e293b;padding:8px 16px;border-radius:20px;font-size:11px;">🔄 Verificando...</div>
  </div>
  <div id="root"></div>
  <script type="module">
    import React, { useEffect, useState, useCallback, useRef } from 'react';
    import ReactDOM from 'react-dom/client';
    import { Tldraw, createTLStore, defaultShapeUtils, defaultBindingUtils } from '@tldraw/tldraw';
    import '@tldraw/tldraw/tldraw.css';

    const params = new URLSearchParams(window.location.search);
    const role = params.get('role') || 'professor';
    const turmaId = params.get('room') || 'global';
    const locked = params.get('locked') === 'true';

    console.log('[LOUSA v12] role=', role, 'turma=', turmaId, 'locked=', locked);

    const overlay = document.getElementById('waiting-overlay');
    const waitingTurma = document.getElementById('waiting-turma');
    if(waitingTurma) waitingTurma.textContent = turmaId;

    // Guard - verifica se professor ativou
    let isAllowed = role !== 'aluno'; // professor sempre permitido
    async function checkAccess(){
      if(role !== 'aluno'){
        if(overlay) overlay.classList.add('hidden');
        return true;
      }
      try{
        const res = await fetch(`/api/workspace/sala/workspace-lousa/status/${encodeURIComponent(turmaId)}`, {credentials:'include'});
        const data = await res.json();
        console.log('[GUARD v12]', data);
        if(!data?.success || !data.ativa){
          isAllowed = false;
          if(overlay) overlay.classList.remove('hidden');
          // Se não está ativa, limpa a lousa local (não mostra dados antigos)
          return false;
        }
        isAllowed = true;
        if(overlay) overlay.classList.add('hidden');
        return true;
      }catch(e){
        console.warn('guard erro', e);
        if(overlay) overlay.classList.add('hidden');
        return true;
      }
    }
    checkAccess();
    setInterval(checkAccess, 3000);

    function useLousaSync(roomId){
      const [store] = useState(() => createTLStore({ shapeUtils: defaultShapeUtils, bindingUtils: defaultBindingUtils }));
      const [connected, setConnected] = useState(false);
      const [peers, setPeers] = useState(1);
      const lastSavedRef = useRef(0);
      const isRemoteUpdateRef = useRef(false);
      const lastRecordCountRef = useRef(0);

      // Função para filtrar apenas shapes (não salva câmera, instância, etc)
      const getShapesOnly = () => {
        const all = store.allRecords();
        const shapes = [];
        for(const r of all){
          // Só salva shapes e bindings, ignora instância, página, câmera, etc
          if(r.typeName === 'shape' || r.typeName === 'binding' || r.typeName === 'asset'){
            shapes.push(r);
          }
        }
        return shapes;
      };

      // Carrega dados iniciais - SÓ se permitido
      useEffect(()=>{
        if(role === 'aluno' && !isAllowed) return;
        let cancelled = false;
        async function load(){
          try{
            const res = await fetch(`/api/workspace/sala/workspace-lousa/dados/${encodeURIComponent(roomId)}`, {credentials:'include'});
            const data = await res.json();
            if(data?.success && data.records && data.records.length > 0 && !cancelled){
              // Filtra para não sobrescrever instância
              const shapesOnly = data.records.filter(r => r.typeName === 'shape' || r.typeName === 'binding' || r.typeName === 'asset');
              if(shapesOnly.length > 0){
                console.log('[LOUSA v12] Carregando', shapesOnly.length, 'shapes da API');
                isRemoteUpdateRef.current = true;
                store.mergeRemoteChanges(()=>{
                  try{ 
                    store.put(shapesOnly); 
                    lastRecordCountRef.current = shapesOnly.length;
                  }catch(e){ console.warn('put inicial', e); }
                });
                isRemoteUpdateRef.current = false;
              }
            }
            setConnected(true);
          }catch(e){ console.warn('load', e); setConnected(true); }
        }
        load();
        return ()=>{ cancelled = true; };
      }, [roomId, store]);

      // Salva mudanças - SÓ professor ou aluno com recursos liberados
      useEffect(()=>{
        if(role === 'aluno' && locked) return; // aluno em visualização não salva

        const unsub = store.listen((entry)=>{
          if(entry.source !== 'user') return;
          if(isRemoteUpdateRef.current) return;
          
          const now = Date.now();
          if(now - lastSavedRef.current < 1000) return; // debounce 1s
          lastSavedRef.current = now;

          const shapes = getShapesOnly();
          // Só salva se mudou a quantidade ou se tem shapes
          if(shapes.length === lastRecordCountRef.current && shapes.length < 2) return;
          lastRecordCountRef.current = shapes.length;

          console.log('[LOUSA v12] Salvando', shapes.length, 'shapes');
          fetch(`/api/workspace/sala/workspace-lousa/dados/${encodeURIComponent(roomId)}`, {
            method:'PUT',
            credentials:'include',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ records: shapes })
          }).catch(()=>{});

        }, {scope:'document', source:'user'});
        return ()=> unsub();
      }, [roomId, store]);

      // Polling aluno - SÓ se permitido e ativo
      useEffect(()=>{
        if(role !== 'aluno') return;
        let interval = null;
        interval = setInterval(async ()=>{
          if(!isAllowed) return;
          try{
            const res = await fetch(`/api/workspace/sala/workspace-lousa/dados/${encodeURIComponent(roomId)}`, {credentials:'include'});
            const data = await res.json();
            if(data?.success && data.records){
              const shapesOnly = data.records.filter(r => r.typeName === 'shape' || r.typeName === 'binding' || r.typeName === 'asset');
              // Só atualiza se tem mais shapes que local ou se local está vazio
              const localCount = getShapesOnly().length;
              if(shapesOnly.length > localCount || (localCount === 0 && shapesOnly.length > 0)){
                console.log('[LOUSA v12] Polling recebeu', shapesOnly.length, 'shapes');
                isRemoteUpdateRef.current = true;
                store.mergeRemoteChanges(()=>{
                  try{ store.put(shapesOnly); }catch{}
                });
                isRemoteUpdateRef.current = false;
              }
            }
          }catch{}
        }, 1500);
        return ()=>{ if(interval) clearInterval(interval); };
      }, [roomId, store]);

      useEffect(()=>{ setTimeout(()=> setConnected(true), 800); }, []);

      return { store, connected, peers };
    }

    function App(){
      const { store, connected, peers } = useLousaSync(turmaId);
      const [editor, setEditor] = useState(null);

      const onMount = useCallback((ed)=>{
        console.log('[TL v12] editor mounted, locked=', locked);
        setEditor(ed);
        ed.updateInstanceState({ isReadonly: role==='aluno' && locked });
        try{ ed.zoomToFit(); }catch{}
      }, []);

      useEffect(()=>{
        if(!editor) return;
        editor.updateInstanceState({ isReadonly: role==='aluno' && locked });
      }, [editor]);

      const isLocked = role==='aluno' && locked;

      return React.createElement('div', {style:{height:'100vh', width:'100vw', display:'flex', flexDirection:'column', background:'#fff'}},
        React.createElement('div', {style:{height:48, background:'#0F172A', color:'#fff', display:'flex', alignItems:'center', justifyContent:'space-between', padding:'0 12px', flexShrink:0}},
          React.createElement('div', {style:{display:'flex', alignItems:'center', gap:10}},
            React.createElement('div', {style:{width:28,height:28,borderRadius:8,background:'#14B8A6',display:'grid',placeItems:'center'}}, '🖍️'),
            React.createElement('div', {style:{fontWeight:600, fontSize:13}}, `Lousa ${turmaId} ${isLocked?'🔒 Visualização':''}`),
            React.createElement('div', {style:{fontSize:10, background: connected ? 'rgba(34,197,94,0.2)' : 'rgba(251,191,36,0.2)', color: connected ? '#86efac' : '#fde68a', padding:'3px 8px', borderRadius:12}}, `${connected ? 'Ao vivo' : 'Conectando'} • ${peers}`)
          ),
          React.createElement('div', {style:{fontSize:9, opacity:0.4}}, `v12 ${role}`)
        ),
        React.createElement('div', {style:{flex:1, minHeight:0, position:'relative', background:'#fff'}},
          React.createElement(Tldraw, { store, onMount, autoFocus:true })
        )
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
