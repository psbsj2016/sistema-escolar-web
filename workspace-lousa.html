<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Lousa v13.2 - Fix tela branca</title>
  <style>
    *,*::before,*::after{box-sizing:border-box}
    html,body,#root{width:100%;height:100%;margin:0;padding:0;font-family:Inter,system-ui,sans-serif;overflow:hidden;background:#fff}
    #waiting-overlay{position:fixed;inset:0;z-index:999999;background:#0f172a;color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;text-align:center;padding:20px}
    #waiting-overlay.hidden{display:none !important}
    #error-overlay{position:fixed;inset:0;z-index:9999999;background:#fdf2f2;color:#c0392b;display:none;align-items:center;justify-content:center;flex-direction:column;gap:15px;padding:30px;text-align:center}
    #error-overlay.show{display:flex !important}
  </style>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.2.0",
      "react-dom": "https://esm.sh/react-dom@18.2.0",
      "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
      "@tldraw/tldraw": "https://esm.sh/@tldraw/tldraw@2.1.4?external=react,react-dom",
      "@tldraw/state": "https://esm.sh/@tldraw/state@2.1.4?external=react",
      "@tldraw/utils": "https://esm.sh/@tldraw/utils@2.1.4?external=react"
    }
  }
  </script>
  <link rel="stylesheet" href="https://esm.sh/@tldraw/tldraw@2.1.4/tldraw.css" />
</head>
<body>
  <div id="waiting-overlay">
    <div style="font-size:60px;">💤</div>
    <h2 style="font-size:18px;margin:0;">Aguardando professor ativar a lousa</h2>
    <p style="color:#94a3b8;font-size:13px;">Turma <span id="waiting-turma"></span></p>
    <div style="background:#1e293b;padding:8px 16px;border-radius:20px;font-size:11px;">🔄 Verificando...</div>
  </div>
  <div id="error-overlay">
    <div style="font-size:50px;">🚨</div>
    <h2 id="error-title">Erro na lousa</h2>
    <pre id="error-msg" style="background:#fff;padding:12px;border-radius:8px;max-width:90%;overflow:auto;font-size:11px;text-align:left;max-height:200px;"></pre>
    <button onclick="location.reload()" style="padding:10px 20px;border-radius:8px;border:0;background:#0F172A;color:#fff;cursor:pointer;">Recarregar</button>
  </div>
  <div id="root" style="width:100%;height:100%"></div>
  <script type="module">
    import React, { useEffect, useState, useCallback, useRef } from 'react';
    import ReactDOM from 'react-dom/client';
    import { Tldraw } from '@tldraw/tldraw';

    console.log('[LOUSA v13.2] Iniciando, userAgent:', navigator.userAgent);

    const params = new URLSearchParams(window.location.search);
    const role = params.get('role') || 'professor';
    const roomId = params.get('room') || 'global';
    const initialLocked = params.get('locked') === 'true';

    const overlay = document.getElementById('waiting-overlay');
    const errorOverlay = document.getElementById('error-overlay');
    const errorMsg = document.getElementById('error-msg');
    const waitingTurma = document.getElementById('waiting-turma');
    if(waitingTurma) waitingTurma.textContent = roomId;

    function showError(e){
      console.error('[LOUSA ERRO]', e);
      if(errorOverlay) errorOverlay.classList.add('show');
      if(errorMsg) errorMsg.textContent = (e?.stack || e?.message || String(e)).slice(0,2000);
    }

    window.addEventListener('error', (ev)=> showError(ev.error || ev.message));
    window.addEventListener('unhandledrejection', (ev)=> showError(ev.reason));

    let isAllowed = role !== 'aluno';
    async function checkAccess(){
      if(role !== 'aluno'){ if(overlay) overlay.classList.add('hidden'); return {allowed:true, recursos:true}; }
      try{
        const res = await fetch(`/api/workspace/sala/workspace-lousa/status/${encodeURIComponent(roomId)}`, {credentials:'include'});
        const data = await res.json();
        console.log('[GUARD v13.2]', data);
        if(data?.success && data.ativa){
          isAllowed = true;
          if(overlay) overlay.classList.add('hidden');
          return {allowed:true, recursos: !!data.recursos};
        } else {
          isAllowed = false;
          if(overlay) overlay.classList.remove('hidden');
          return {allowed:false, recursos:false};
        }
      }catch(e){
        console.warn('guard erro', e);
        return {allowed:true, recursos:true};
      }
    }

    function App(){
      const [editor, setEditor] = useState(null);
      const [connected, setConnected] = useState(false);
      const [dynamicLocked, setDynamicLocked] = useState(initialLocked);
      const isRemoteUpdateRef = useRef(false);
      const lastSavedRef = useRef(0);
      const lastCountRef = useRef(0);

      useEffect(()=>{
        const onMsg = (e)=>{
          if(e.data?.type === 'LOCK_STATE'){
            console.log('[LOCK_STATE]', e.data.locked);
            setDynamicLocked(!!e.data.locked);
          }
          if(e.data?.type === 'RELOAD_DADOS'){
            if(window._loadCloud) window._loadCloud();
          }
        };
        window.addEventListener('message', onMsg);
        return ()=> window.removeEventListener('message', onMsg);
      },[]);

      useEffect(()=>{
        if(editor){
          try{
            editor.updateInstanceState({ isReadonly: role==='aluno' && dynamicLocked });
          }catch(e){ console.warn('readonly', e); }
        }
      },[editor, dynamicLocked]);

      const onMount = useCallback((ed)=>{
        console.log('[LOUSA v13.2] mounted, role=', role);
        try{
          setEditor(ed);
          ed.updateInstanceState({ isReadonly: role==='aluno' && dynamicLocked });

          const loadCloud = async () => {
            try{
              const access = await checkAccess();
              if(role==='aluno' && !access.allowed){ setConnected(true); return; }
              if(typeof access.recursos !== 'undefined') setDynamicLocked(!access.recursos);

              const res = await fetch(`/api/workspace/sala/workspace-lousa/dados/${encodeURIComponent(roomId)}`, {credentials:'include'});
              const data = await res.json();
              if(data?.success && data.records && data.records.length>0){
                const shapesOnly = data.records.filter(r => r.typeName==='shape' || r.typeName==='binding' || r.typeName==='asset');
                if(shapesOnly.length>0){
                  console.log('[LOAD]', shapesOnly.length);
                  isRemoteUpdateRef.current = true;
                  ed.store.mergeRemoteChanges(()=>{
                    try{ ed.store.put(shapesOnly); lastCountRef.current = shapesOnly.length; }catch(e){ console.warn('put', e); }
                  });
                  isRemoteUpdateRef.current = false;
                }
              }
            }catch(e){ console.warn('load', e); } finally { setConnected(true); }
          };

          window._loadCloud = loadCloud;
          loadCloud();

          ed.store.listen((entry)=>{
            if(entry.source!=='user') return;
            if(isRemoteUpdateRef.current) return;
            if(role==='aluno' && dynamicLocked) return;
            const now = Date.now();
            if(now - lastSavedRef.current < 800) return;
            lastSavedRef.current = now;
            try{
              const all = ed.store.allRecords();
              const shapes = [];
              for(const r of all){
                if(r.typeName==='shape' || r.typeName==='binding' || r.typeName==='asset') shapes.push(r);
              }
              if(shapes.length===0 && lastCountRef.current===0) return;
              lastCountRef.current = shapes.length;
              console.log('[SAVE]', shapes.length);
              fetch(`/api/workspace/sala/workspace-lousa/dados/${encodeURIComponent(roomId)}`, {
                method:'PUT', credentials:'include', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({ records: shapes })
              }).catch(()=>{});
            }catch(e){ console.warn('save', e); }
          }, {scope:'document', source:'user'});

        }catch(e){ showError(e); }
      }, [dynamicLocked]);

      useEffect(()=>{
        if(role!=='aluno') return;
        const poll = setInterval(async()=>{
          if(!isAllowed){
            const acc = await checkAccess();
            if(!acc.allowed) return;
            if(typeof acc.recursos !== 'undefined') setDynamicLocked(!acc.recursos);
          }
          if(window._loadCloud) window._loadCloud();
        }, 2500);

        let es=null;
        try{
          let escolaId='DEFAULT';
          try{ escolaId = JSON.parse(localStorage.getItem('ws_usuario_logado')||'{}').escolaId || 'DEFAULT'; }catch{}
          es = new EventSource(`/api/workspace/stream?escolaId=${encodeURIComponent(escolaId)}`);
          es.onmessage = (ev)=>{
            try{
              const data = JSON.parse(ev.data);
              if(data.type==='LOUSA_STATUS_CHANGED' && (data.turmaId===roomId || data.turmaId==='global')){
                console.log('[SSE STATUS]', data);
                if(!data.ativa){ isAllowed=false; if(overlay) overlay.classList.remove('hidden'); }
                else { isAllowed=true; if(overlay) overlay.classList.add('hidden'); setDynamicLocked(!data.recursos); }
              }
              if(data.type==='LOUSA_DADOS_CHANGED' && data.turmaId===roomId){
                if(window._loadCloud) window._loadCloud();
              }
            }catch{}
          };
        }catch(e){}
        return ()=>{ clearInterval(poll); if(es) try{ es.close(); }catch{} };
      },[roomId]);

      useEffect(()=>{ 
        const t = setInterval(checkAccess, 3000);
        checkAccess().then(acc=>{ if(acc && typeof acc.recursos !== 'undefined' && role==='aluno') setDynamicLocked(!acc.recursos); });
        return ()=> clearInterval(t);
      },[]);

      const isLocked = role==='aluno' && dynamicLocked;

      return React.createElement('div',{style:{width:'100vw',height:'100vh',display:'flex',flexDirection:'column',background:'#fff'}},
        React.createElement('div',{style:{height:44,background:'#0F172A',color:'#fff',display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 12px',flexShrink:0}},
          React.createElement('div',{style:{display:'flex',alignItems:'center',gap:8}},
            React.createElement('span',null,'🖍️'),
            React.createElement('span',{style:{fontWeight:600,fontSize:12}}, isLocked ? 'Lousa (Leitura)' : 'Lousa Interativa'),
            React.createElement('span',{style:{fontSize:9,background:connected?'rgba(34,197,94,0.2)':'rgba(251,191,36,0.2)',color:connected?'#86efac':'#fde68a',padding:'2px 6px',borderRadius:10}}, connected?'Ao vivo':'Conectando')
          ),
          React.createElement('div',{style:{fontSize:9,opacity:0.4}}, `v13.2 ${role} ${isLocked?'🔒':''}`)
        ),
        React.createElement('div',{style:{flex:1,position:'relative',minHeight:0}},
          React.createElement(Tldraw,{onMount:onMount})
        )
      );
    }

    try{
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(React.createElement(App));
    }catch(e){ showError(e); }
  </script>
</body>
</html>
