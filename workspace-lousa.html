<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Lousa Interativa</title>
  <style>
    *{box-sizing:border-box} 
    html,body,#root{height:100%;margin:0;font-family:Inter,system-ui,sans-serif;overflow:hidden}
    #waiting-overlay{position:fixed;inset:0;z-index:999999;background:#0f172a;color:#fff;display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px;text-align:center;padding:20px}
    .tl-container{flex:1; min-height:0; position:relative}
  </style>
</head>
<body>
  <div id="waiting-overlay">
    <div style="font-size:60px;">💤</div>
    <h2 style="font-size:18px;margin:0;">Aguardando professor ativar</h2>
    <p id="waiting-room" style="color:#94a3b8;font-size:13px;"></p>
  </div>
  <div id="root"></div>
  <script type="module">
    import React, { useEffect, useState, useCallback, useRef } from 'react';
    import ReactDOM from 'react-dom/client';
    import { Tldraw, createTLStore, defaultShapeUtils, defaultBindingUtils } from '@tldraw/tldraw';
    import '@tldraw/tldraw/tldraw.css';

    const params = new URLSearchParams(window.location.search);
    const role = params.get('role') || 'professor';
    const turmaId = params.get('room') || 'global';
    const locked = params.get('locked') === 'true';

    console.log('[LOUSA v11] role=', role, 'turma=', turmaId, 'locked=', locked);

    // Guard
    const overlay = document.getElementById('waiting-overlay');
    async function checkAccess(){
      if(role !== 'aluno'){ if(overlay) overlay.style.display='none'; return true; }
      try{
        const res = await fetch(`/api/workspace/sala/workspace-lousa/status/${encodeURIComponent(turmaId)}`, {credentials:'include'});
        const data = await res.json();
        if(!data?.success || !data.ativa){
          if(overlay) overlay.style.display='flex';
          setTimeout(checkAccess, 3000); return false;
        }
        if(overlay) overlay.style.display='none'; return true;
      }catch{ if(overlay) overlay.style.display='none'; return true; }
    }
    checkAccess();

    function useLousaSync(roomId){
      const [store] = useState(() => createTLStore({ shapeUtils: defaultShapeUtils, bindingUtils: defaultBindingUtils }));
      const [connected, setConnected] = useState(false);
      const [peers, setPeers] = useState(1);
      const lastSavedRef = useRef(0);
      const isRemoteUpdateRef = useRef(false);

      // Carrega dados iniciais da API
      useEffect(()=>{
        let cancelled = false;
        async function load(){
          try{
            const res = await fetch(`/api/workspace/sala/workspace-lousa/dados/${encodeURIComponent(roomId)}`, {credentials:'include'});
            const data = await res.json();
            if(data?.success && data.records && data.records.length > 0 && !cancelled){
              console.log('[LOUSA v11] Carregando', data.records.length, 'records da API');
              isRemoteUpdateRef.current = true;
              store.mergeRemoteChanges(()=>{
                try{ store.put(data.records); }catch(e){ console.warn('put inicial', e); }
              });
              isRemoteUpdateRef.current = false;
              setConnected(true);
            }
          }catch(e){ console.warn('load inicial', e); }
        }
        load();
        return ()=>{ cancelled = true; };
      }, [roomId, store]);

      // Salva mudanças locais na API (debounced)
      useEffect(()=>{
        const unsub = store.listen((entry)=>{
          if(entry.source !== 'user') return;
          if(isRemoteUpdateRef.current) return;
          
          const now = Date.now();
          if(now - lastSavedRef.current < 800) return; // debounce 800ms
          lastSavedRef.current = now;

          const allRecords = store.allRecords();
          const recordsArray = Array.from(allRecords.values());

          // Salva na API
          fetch(`/api/workspace/sala/workspace-lousa/dados/${encodeURIComponent(roomId)}`, {
            method:'PUT',
            credentials:'include',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ records: recordsArray })
          }).then(()=> console.log('[LOUSA v11] Salvou', recordsArray.length, 'records')).catch(()=>{});

        }, {scope:'document', source:'user'});
        return ()=> unsub();
      }, [roomId, store]);

      // Polling: busca atualizações a cada 2s (para aluno)
      useEffect(()=>{
        let interval = null;
        if(role === 'aluno'){
          interval = setInterval(async ()=>{
            try{
              const res = await fetch(`/api/workspace/sala/workspace-lousa/dados/${encodeURIComponent(roomId)}`, {credentials:'include'});
              const data = await res.json();
              if(data?.success && data.records && data.records.length > 0){
                isRemoteUpdateRef.current = true;
                store.mergeRemoteChanges(()=>{
                  try{ store.put(data.records); }catch{}
                });
                isRemoteUpdateRef.current = false;
                setConnected(true);
                setPeers(2); // simula 2 peers
              }
            }catch{}
          }, 2000);
        }
        return ()=>{ if(interval) clearInterval(interval); };
      }, [roomId, store]);

      // Listener para eventos realtime via SSE (se seu workspaceStream emitir)
      useEffect(()=>{
        const handler = (e) => {
          try{
            const data = JSON.parse(e.data);
            if(data.type === 'LOUSA_DADOS_CHANGED' && data.turmaId === roomId){
              console.log('[LOUSA v11] Evento realtime dados mudaram');
              fetch(`/api/workspace/sala/workspace-lousa/dados/${encodeURIComponent(roomId)}`, {credentials:'include'})
                .then(r=>r.json()).then(d=>{
                  if(d?.success && d.records){
                    isRemoteUpdateRef.current = true;
                    store.mergeRemoteChanges(()=>{ try{ store.put(d.records); }catch{} });
                    isRemoteUpdateRef.current = false;
                  }
                });
            }
          }catch{}
        };
        // Tenta conectar no SSE se existir
        try{
          const es = new EventSource('/api/workspace/stream', {withCredentials:true});
          es.addEventListener('evento_realtime', handler);
          return ()=> es.close();
        }catch{ return ()=>{}; }
      }, [roomId, store]);

      useEffect(()=>{ setTimeout(()=> setConnected(true), 1000); }, []);

      return { store, connected, peers };
    }

    function App(){
      const { store, connected, peers } = useLousaSync(turmaId);
      const [editor, setEditor] = useState(null);

      const onMount = useCallback((ed)=>{
        console.log('[TL v11] editor mounted');
        setEditor(ed);
        if(role==='aluno' && locked){
          ed.updateInstanceState({ isReadonly: true });
        } else {
          ed.updateInstanceState({ isReadonly: false });
        }
        try{ ed.zoomToFit(); }catch{}
      }, []);

      useEffect(()=>{
        if(!editor) return;
        editor.updateInstanceState({ isReadonly: role==='aluno' && locked });
      }, [editor]);

      const isLocked = role==='aluno' && locked;

      return React.createElement('div', {style:{height:'100vh', width:'100vw', display:'flex', flexDirection:'column', background:'#fff'}},
        React.createElement('div', {style:{height:56, background:'#1e293b', color:'#fff', display:'flex', alignItems:'center', justifyContent:'space-between', padding:'0 16px', flexShrink:0}},
          React.createElement('div', {style:{display:'flex', alignItems:'center', gap:12}},
            React.createElement('div', {style:{width:32,height:32,borderRadius:8,background:'#14B8A6',display:'grid',placeItems:'center'}}, '✏️'),
            React.createElement('div', null,
              React.createElement('div', {style:{fontWeight:700, fontSize:14}}, `Lousa ${turmaId} ${isLocked?'🔒':''}`),
              React.createElement('div', {style:{fontSize:11, opacity:0.7, display:'flex', alignItems:'center', gap:6}},
                React.createElement('span', {style:{width:8,height:8,borderRadius:'50%', background: connected ? '#22c55e' : '#f59e0b', display:'inline-block'}}),
                `${connected ? 'Ao vivo' : 'Sincronizando...'} • ${peers}`
              )
            )
          ),
          React.createElement('div', {style:{fontSize:10, opacity:0.5}}, `${role} • v11 API`)
        ),
        React.createElement('div', {className:'tl-container', style:{flex:1, minHeight:0, position:'relative', background:'#fff'}},
          React.createElement(Tldraw, { store, onMount, autoFocus:true })
        )
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
