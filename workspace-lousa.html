<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Lousa Interativa</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body, #root { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #fff; font-family: Inter, system-ui, sans-serif; }
    /* 🚀 Cimentamos as paredes para as ferramentas não sumirem */
    .tldraw-wrapper { position: absolute; top: 45px; left: 0; right: 0; bottom: 0; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="module">
    import React, { useEffect, useState, useCallback, useRef } from 'react';
    import ReactDOM from 'react-dom/client';
    import { Tldraw } from '@tldraw/tldraw';
    import '@tldraw/tldraw/tldraw.css';

    const params = new URLSearchParams(window.location.search);
    const role = params.get('role') || 'professor';
    const roomId = params.get('room') || 'global';
    const initialLocked = params.get('locked') === 'true';

    function App() {
      const [editor, setEditor] = useState(null);
      
      // 🚀 1. GESTÃO DE ACESSO BLINDADA NO REACT
      const [isAllowed, setIsAllowed] = useState(role !== 'aluno');
      const [dynamicLocked, setDynamicLocked] = useState(initialLocked);
      const [connected, setConnected] = useState(false);
      
      const isRemoteUpdateRef = useRef(false);
      const lastSavedRef = useRef(0);

      useEffect(() => {
        if (role !== 'aluno') return;
        const checkAccess = async () => {
          try {
            const res = await fetch(`/api/workspace/sala/workspace-lousa/status/${encodeURIComponent(roomId)}`);
            const data = await res.json();
            if (data?.success && data.ativa) {
              setIsAllowed(true);
              if (typeof data.recursos !== 'undefined') setDynamicLocked(!data.recursos);
            } else {
              setIsAllowed(false);
            }
          } catch (e) {
            // Em caso de falha de rede leve, não mudamos o estado para não causar interrupções
          }
        };
        checkAccess();
        const inv = setInterval(checkAccess, 3000);
        return () => clearInterval(inv);
      }, [roomId]);

      // 🚀 2. COMANDOS SILENCIOSOS (Cadeado do Professor)
      useEffect(() => {
          const handleMsg = (e) => { 
              if (e.data?.type === 'LOCK_STATE') setDynamicLocked(e.data.locked); 
          };
          window.addEventListener('message', handleMsg);
          return () => window.removeEventListener('message', handleMsg);
      }, []);

      // 🚀 3. ATUALIZA A CANETA (Lápis Trancado/Destrancado)
      useEffect(() => {
          if (editor) {
              editor.updateInstanceState({ isReadonly: role === 'aluno' && dynamicLocked });
          }
      }, [editor, dynamicLocked]);

      // 🚀 4. INICIALIZAÇÃO E SINCRONIZAÇÃO
      const onMount = useCallback((ed) => {
          setEditor(ed);
          ed.updateInstanceState({ isReadonly: role === 'aluno' && dynamicLocked });

          const carregarNuvem = async () => {
              try {
                  const res = await fetch(`/api/workspace/sala/workspace-lousa/dados/${encodeURIComponent(roomId)}`);
                  const data = await res.json();
                  if (data?.records && data.records.length > 0) {
                      const shapesOnly = data.records.filter(r => r.typeName === 'shape' || r.typeName === 'binding' || r.typeName === 'asset');
                      isRemoteUpdateRef.current = true;
                      ed.store.mergeRemoteChanges(() => {
                          try { ed.store.put(shapesOnly); } catch(e){}
                      });
                      isRemoteUpdateRef.current = false;
                  }
                  setConnected(true);
              } catch(e) {}
          };

          // Carrega inicialmente para todos
          carregarNuvem();
          window._carregarNuvemLocal = carregarNuvem;

          // ⚠️ Professor grava! Aluno trancado NÃO grava.
          ed.store.listen((entry) => {
              if (entry.source !== 'user') return;
              if (isRemoteUpdateRef.current) return;
              if (role === 'aluno' && dynamicLocked) return; 

              const now = Date.now();
              if (now - lastSavedRef.current < 600) return; // Debounce otimizado
              lastSavedRef.current = now;

              const records = ed.store.allRecords().filter(r => r.typeName === 'shape' || r.typeName === 'binding' || r.typeName === 'asset');
              
              fetch(`/api/workspace/sala/workspace-lousa/dados/${encodeURIComponent(roomId)}`, {
                  method: 'PUT', headers: {'Content-Type': 'application/json'},
                  body: JSON.stringify({ records })
              }).catch(()=>{});

          }, { scope: 'document', source: 'user' });

      }, [dynamicLocked, roomId]);

      // 🚀 5. TÚNEL SSE - APENAS O ALUNO ESCUTA (Para não crashar o Professor)
      useEffect(() => {
          let escolaId = 'DEFAULT';
          try { escolaId = JSON.parse(localStorage.getItem('ws_usuario_logado')).escolaId; } catch(e){}
          
          const es = new EventSource(`/api/workspace/stream?escolaId=${encodeURIComponent(escolaId)}`);
          es.onmessage = (event) => {
              try {
                  const data = JSON.parse(event.data);
                  if (data.type === 'LOUSA_DADOS_CHANGED' && (data.turmaId === roomId || data.turmaId === 'global')) {
                      if (role === 'aluno' && window._carregarNuvemLocal) {
                          window._carregarNuvemLocal();
                      }
                  }
              } catch(e){}
          };
          
          // Polling de segurança (Apenas para o aluno)
          let interval;
          if (role === 'aluno') {
             interval = setInterval(() => { if (window._carregarNuvemLocal) window._carregarNuvemLocal(); }, 4000);
          }

          return () => { es.close(); if(interval) clearInterval(interval); };
      }, [roomId]);

      // =======================================================
      // 🎨 RENDERIZAÇÃO INTELIGENTE
      // =======================================================
      
      // TELA DE BLOQUEIO ABSOLUTO (O ALUNO NÃO VÊ A LOUSA)
      if (!isAllowed) {
          return React.createElement('div', {style:{position:'fixed',inset:0,background:'#0f172a',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:'20px',textAlign:'center',padding:'20px', zIndex:999999}},
              React.createElement('div', {style:{fontSize:'60px', filter:'grayscale(100%) opacity(0.5)', animation:'pulse 2s infinite'}}, '⏳'),
              React.createElement('h2', {style:{fontSize:'22px', margin:'0 0 10px 0'}}, 'A lousa surgirá em instantes'),
              React.createElement('p', {style:{color:'#94a3b8', fontSize:'14px'}}, 'Aguardando o professor ativar a sala.'),
              React.createElement('div', {style:{background:'rgba(255,255,255,0.1)', padding:'8px 16px', borderRadius:'20px', fontSize:'12px', fontWeight:'bold'}}, '🔄 Conectado ao servidor')
          );
      }

      // LOUSA DIGITAL
      const isLocked = role === 'aluno' && dynamicLocked;

      return React.createElement('div', {style:{width:'100%', height:'100%', display:'flex', flexDirection:'column'}},
          React.createElement('div', {style:{height:'45px', background:'#0F172A', color:'#fff', display:'flex', alignItems:'center', justifyContent:'space-between', padding:'0 15px', flexShrink:0}},
              React.createElement('div', {style:{display:'flex', alignItems:'center', gap:'10px'}},
                  React.createElement('span', {style:{fontSize:'18px'}}, '🖍️'),
                  React.createElement('span', {style:{fontWeight:600, fontSize:'14px'}}, isLocked ? 'Lousa (Modo Leitura)' : 'Lousa Interativa'),
                  React.createElement('span', {style:{fontSize:'10px', background: connected ? 'rgba(34,197,94,0.2)' : 'rgba(251,191,36,0.2)', color: connected ? '#86efac' : '#fde68a', padding:'3px 8px', borderRadius:'12px'}}, connected ? 'Ao vivo' : 'Conectando...')
              )
          ),
          React.createElement('div', {className:'tldraw-wrapper'},
              React.createElement(Tldraw, { onMount: onMount })
          )
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
