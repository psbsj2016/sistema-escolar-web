<!-- 🚀 MOTOR DE BLOQUEIO PARA ALUNOS -->
  <script>
    window.onload = () => {
      const urlParams = new URLSearchParams(window.location.search);
      const isAluno = urlParams.get('role') === 'aluno';
      const isLocked = urlParams.get('locked') === 'true';

      // Se for aluno E o professor não tiver liberado, aplica o bloqueio de ecrã
      if (isAluno && isLocked) {
        const style = document.createElement('style');
        style.innerHTML = `
          /* Esconde o menu lateral de ferramentas */
          aside { display: none !important; }
          /* Esconde o cabeçalho superior */
          header { display: none !important; }
          /* Esconde a barra flutuante de zoom/cores */
          .absolute.bottom-3 { display: none !important; }
          /* Bloqueia cliques e desenho no quadro */
          canvas { pointer-events: none !important; }
          /* Bloqueia a edição de caixas de texto existentes */
          textarea { pointer-events: none !important; border: none !important; background: transparent !important; }
        `;
        document.head.appendChild(style);
      }
    };

    // Escuta a ordem do portal principal para destrancar a lousa
    window.addEventListener('message', (event) => {
      if (event.data === 'UNLOCK_BOARD') {
        // Recarrega a página removendo o bloqueio, dando acesso total ao aluno
        location.search = '?role=aluno&locked=false'; 
      }
    });
  </script>
